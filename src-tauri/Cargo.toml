[package]
name = "rstris"
version = "0.1.0"
description = "Tetris built with Rust and Tauri"
authors = ["fredrir"]
edition = "2024"

[lib]
name = "rstris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
rand = "0.10"
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
